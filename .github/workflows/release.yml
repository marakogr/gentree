name: Release

# Publishing a release is a tag push: `git tag v0.2.0 && git push origin v0.2.0`.
# The version in desktop/apps/desktop/tauri.conf.json must match the tag.
#
# The workflow creates a DRAFT GitHub release. Nothing becomes public until a
# maintainer reviews the artifacts and publishes the draft.
#
# This pipeline builds update artifacts and publishes `latest.json` next to the
# installer, so an installed build can update itself from GitHub Releases. The
# updater endpoint and the matching public key live in tauri.conf.json; the
# private key is the TAURI_SIGNING_PRIVATE_KEY secret and never leaves the
# secret store. Without that secret the release fails before the build starts.
#
# Every job runs the quality gates before building and verifies its artifacts
# before publishing them:
#   - fmt, clippy and the Rust and UI tests on each platform (the same set as
#     `make check`), so a platform-specific test failure stops the release,
#   - code signatures (blocking when WINDOWS_CERTIFICATE or APPLE_CERTIFICATE is
#     configured),
#   - Microsoft Defender scan (advisory smoke test, Windows only),
#   - SHA256SUMS-<platform>-<arch>.txt next to the artifacts.
# The Windows job also builds the portable archive from a production executable
# that ships with the updater disabled (tauri.portable.conf.json).
#
# Platforms: Windows x64 (NSIS installer and portable archive) and macOS arm64
# (.dmg). macOS artifacts stay unsigned and un-notarized until the APPLE_*
# secrets exist; the verification step only requires a signature when the
# certificate is configured, and the release notes say which case applies.
# See docs/releases.md.
#
# Only the NSIS installer is published: it installs per user, needs no
# administrator rights, and the updater can run it silently. The MSI stays a
# local build for managed deployments.
#
# Optional repository secrets (names only, never values):
#   WINDOWS_CERTIFICATE                 base64 of a .pfx code-signing certificate
#   WINDOWS_CERTIFICATE_PASSWORD        password of that .pfx
# Without the certificate pair the Windows artifacts are still built, but they
# are unsigned and the signature check only warns. See docs/releases.md.
#
# Optional macOS signing and notarization secrets (names only, never values):
#   APPLE_CERTIFICATE                   base64 of a Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD          password set when exporting that .p12
#   APPLE_SIGNING_IDENTITY              "Developer ID Application: Name (TEAMID)"
#   APPLE_TEAM_ID                       the TEAMID from the identity
#   APPLE_ID + APPLE_PASSWORD           Apple ID and an app-specific password,
#                                       or APPLE_API_KEY + APPLE_API_ISSUER +
#                                       APPLE_API_KEY_P8 (the .p8 contents; the
#                                       workflow writes the key file and sets
#                                       APPLE_API_KEY_PATH itself)
# Without APPLE_CERTIFICATE the .dmg is published unsigned and Gatekeeper asks
# the user to allow it. See docs/releases.md.
#
# Updater signing secrets (required):
#   TAURI_SIGNING_PRIVATE_KEY          full contents of the minisign private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD its password, empty when there is none
# See docs/releases.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            sums: release-assets/SHA256SUMS-windows-x64.txt
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            sums: release-assets/SHA256SUMS-macos-arm64.txt
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop

      - name: Install UI dependencies
        run: npm ci --prefix desktop/ui

      # A tag can point at any commit, so the release re-runs the gates from
      # `make check` on every platform. Running them per matrix entry is what
      # catches a test that only works on one OS.
      - name: Check Rust formatting
        working-directory: desktop
        run: cargo fmt --all -- --check

      - name: Lint Rust
        working-directory: desktop
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        working-directory: desktop
        run: cargo test --workspace

      - name: Test the UI
        run: npm --prefix desktop/ui run test

      - name: Check the locales
        run: npm --prefix desktop/ui run i18n:check

      - name: Check that the tag matches the app version
        run: node -e "const fs=require('fs');const tag=process.env.GITHUB_REF_NAME.replace(/^v/,'');const version=JSON.parse(fs.readFileSync('desktop/apps/desktop/tauri.conf.json','utf8')).version;if(version!==tag){console.error('tag '+tag+' does not match tauri.conf.json version '+version);process.exit(1);}console.log('release version '+version);"

      # A release that silently shipped a placeholder endpoint would produce a
      # `latest.json` nobody can reach, so fail here instead of after the build.
      - name: Check that the updater is configured
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $config = Get-Content 'desktop/apps/desktop/tauri.conf.json' -Raw | ConvertFrom-Json
          $updater = $config.plugins.updater
          $endpoint = @($updater.endpoints) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1
          if (-not $endpoint -or $endpoint -match 'REPLACE_WITH|updates\.invalid' -or -not $endpoint.StartsWith('https://')) {
            throw 'tauri.conf.json has no real https updater endpoint'
          }
          if ([string]::IsNullOrWhiteSpace($updater.pubkey) -or $updater.pubkey -match 'REPLACE_WITH') {
            throw 'tauri.conf.json has no real updater public key'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is not configured: updater artifacts cannot be signed'
          }
          Write-Host "Updater channel is configured for version $($config.version)."

      # Writes the signing overlay consumed by tauri-action on every platform:
      # an empty object means "build unsigned". The file always exists, so the
      # build args stay identical whether or not a certificate is configured.
      - name: Prepare Windows code signing (optional)
        id: signing
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $overlay = 'desktop/apps/desktop/tauri.signing.conf.json'
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)
          if ($env:RUNNER_OS -ne 'Windows' -or -not $hasCertificate) {
            [IO.File]::WriteAllText($overlay, '{}')
            "thumbprint=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            if ($env:RUNNER_OS -eq 'Windows') {
              Write-Host '::warning::WINDOWS_CERTIFICATE is not set; the Windows artifacts stay unsigned.'
            }
            exit 0
          }
          $tempDir = if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) { [IO.Path]::GetTempPath() } else { $env:RUNNER_TEMP }
          $pfx = Join-Path $tempDir 'gentree-signing.pfx'
          # Accept both a bare base64 blob and certutil output with header lines.
          $base64 = $env:WINDOWS_CERTIFICATE -replace '[^A-Za-z0-9+/=]', ''
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($base64))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          try {
            $certificates = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          } finally {
            Remove-Item -Path $pfx -Force -ErrorAction SilentlyContinue
          }
          $certificate = $certificates | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          if (-not $certificate) { throw 'the PFX did not contain a certificate with a private key' }
          $signing = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm       = 'sha256'
                timestampUrl          = 'http://timestamp.acs.microsoft.com'
                tsp                   = $true
              }
            }
          } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText($overlay, $signing)
          "thumbprint=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Windows signing enabled with certificate $($certificate.Thumbprint)."

      # tauri-action signs and notarizes the macOS bundle itself when the
      # APPLE_* variables are present; there is no overlay to write. These two
      # steps only prepare the optional API key and make the unsigned case
      # visible in the log.
      - name: Prepare the macOS notarization key (optional)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key_path="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
            chmod 600 "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
            echo "App Store Connect API key written for notarization."
          fi

      - name: Report the macOS signing status
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE is not set; the macOS artifacts stay unsigned and are not notarized."
          else
            echo "macOS signing and notarization are configured."
          fi

      - name: Read the changelog section
        id: changelog
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $heading = $lines | Select-String -Pattern ('^## \[' + [regex]::Escape($version) + '\]') | Select-Object -First 1
          if (-not $heading) { throw "CHANGELOG.md has no section for $version" }
          $start = $heading.LineNumber - 1
          $section = [System.Collections.Generic.List[string]]::new()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($i -gt $start -and ($lines[$i] -match '^## \[' -or $lines[$i] -match '^\[[^\]]+\]:')) { break }
            if ($i -eq $start) { continue }
            $section.Add($lines[$i])
          }
          $body = ($section -join "`n").Trim()
          "body<<CHANGELOG_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "CHANGELOG_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build and upload the draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Empty on an unsigned build: Tauri then skips signing and notarizing.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization: an Apple ID with an app-specific password, or an
          # App Store Connect API key (the file is written by the step above).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          projectPath: desktop/apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Gentree ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          # Prepended to the generated notes. Keep the checksum and SmartScreen
          # steps in sync with README.md: users see this before they download.
          releaseBody: |
            ### What's new

            ${{ steps.changelog.outputs.body }}

            ### Installing on Windows

            The builds are not code-signed yet, so Windows SmartScreen shows
            "Windows protected your PC" the first time you open the installer
            or the portable executable. This does not mean the file is unsafe:
            click **More info**, then **Run anyway**.

            Before running, verify the download against
            `SHA256SUMS-windows-x64.txt` from the same release:

            ```powershell
            Get-FileHash .\Gentree___VERSION___x64-setup.exe -Algorithm SHA256
            ```

            Windows 11 **Smart App Control** blocks unsigned apps with no
            per-app exception; turning it off is a system-wide security change.
            Code signing is planned, and a signed build will not trip either
            gate.

            ### Installing on macOS (Apple Silicon)

            Download `Gentree___VERSION___aarch64.dmg` and verify it against
            `SHA256SUMS-macos-arm64.txt` from the same release:

            ```bash
            shasum -a 256 -c SHA256SUMS-macos-arm64.txt
            ```

            If Gatekeeper refuses the first launch (the build is notarized only
            once the APPLE_* secrets are configured), open **System Settings →
            Privacy & Security** and click **Open Anyway**, or clear the
            quarantine flag after the checksum matched:

            ```bash
            xattr -dr com.apple.quarantine Gentree___VERSION___aarch64.dmg
            ```

            Intel Macs are not covered by this release yet; build from source
            with `make build`.
          # `latest.json` points installed builds at the artifact of this release.
          includeUpdaterJson: true
          # Only NSIS is published. The MSI is a local build for managed
          # deployments and is not part of the release assets.
          updaterJsonPreferNsis: true
          # The first overlay produces the `.sig` files and the updater archive,
          # the second one adds the optional Authenticode certificate. macOS
          # needs no overlay: Tauri reads the APPLE_* variables instead.
          args: >-
            --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
            --config tauri.release.conf.json
            ${{ matrix.platform == 'windows-latest' && '--config tauri.signing.conf.json' || '' }}

      # The portable executable is a separate build: tauri.portable.conf.json
      # empties the updater endpoint so a portable copy can never install itself
      # into %LOCALAPPDATA%, and --no-bundle skips installers entirely.
      - name: Build the portable executable
        if: matrix.platform == 'windows-latest'
        working-directory: desktop/apps/desktop
        shell: pwsh
        run: |
          & ..\..\ui\node_modules\.bin\tauri.cmd build --no-bundle --target x86_64-pc-windows-msvc --config tauri.portable.conf.json
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed with exit code $LASTEXITCODE" }

      # tauri-action signs the bundled executables; the portable one is built
      # separately, so it is signed here with the same certificate.
      - name: Sign the portable executable
        if: matrix.platform == 'windows-latest' && steps.signing.outputs.thumbprint != ''
        shell: pwsh
        run: |
          $exe = 'desktop/target/x86_64-pc-windows-msvc/release/gentree-desktop.exe'
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $signtool) { throw 'signtool.exe was not found' }
          & $signtool sign /fd sha256 /td sha256 /tr http://timestamp.acs.microsoft.com /sha1 "${{ steps.signing.outputs.thumbprint }}" $exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }

      - name: Package the portable archive
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          SIGNED: ${{ steps.signing.outputs.thumbprint != '' }}
        run: |
          $version = (Get-Content 'desktop/apps/desktop/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $arguments = @(
            'scripts/package-portable.mjs',
            '--exe', 'desktop/target/x86_64-pc-windows-msvc/release/gentree-desktop.exe',
            '--version', $version,
            '--out', 'release-assets'
          )
          if ($env:SIGNED -eq 'true') { $arguments += '--signed' }
          node @arguments

      - name: Verify Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          SIGNED: ${{ steps.signing.outputs.thumbprint != '' }}
        run: |
          $bundle = 'desktop/target/x86_64-pc-windows-msvc/release/bundle'
          $setup = Get-ChildItem -Path $bundle -Recurse -File -Filter '*-setup.exe' | Select-Object -First 1 -ExpandProperty FullName
          $portable = Get-ChildItem -Path 'release-assets' -File -Filter '*_portable.zip' | Select-Object -First 1 -ExpandProperty FullName
          $arguments = @(
            'scripts/verify-release.mjs',
            '--verify-only', 'desktop/target/x86_64-pc-windows-msvc/release/gentree-desktop.exe',
            '--asset', $setup,
            '--asset', $portable,
            '--sums', 'release-assets/SHA256SUMS-windows-x64.txt',
            '--defender'
          )
          if ($env:SIGNED -eq 'true') { $arguments += '--require-signature' }
          node @arguments

      - name: Upload the portable archive and checksums
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" release-assets/* --clobber

      # The `.dmg` itself is uploaded by tauri-action; this step only adds the
      # checksum file. Signature checks are blocking only once the certificate
      # exists, same as on Windows.
      - name: Verify the macOS artifacts
        if: matrix.platform == 'macos-latest'
        env:
          SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          shopt -s nullglob
          dmgs=(desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "no .dmg was produced" >&2
            exit 1
          fi
          arguments=(--asset "${dmgs[0]}" --sums "${{ matrix.sums }}")
          if [ "$SIGNED" = "true" ]; then
            arguments+=(--require-signature)
          fi
          node scripts/verify-release.mjs "${arguments[@]}"

      - name: Upload the macOS checksums
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.sums }}" --clobber
