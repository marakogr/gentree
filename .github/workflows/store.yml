name: Store package

# Builds the Microsoft Store upload: a full-trust MSIX with the Partner Center
# identity, produced from a `--features store` build (no in-app updater).
#
# The Store signs the package itself after certification, so this workflow never
# signs it. The artifact is the exact file to drop into Partner Center
# ("Packages") and nothing else: uploading a self-signed copy is rejected.
# See docs/store.md.
#
# Triggers:
#   - a tag push, so the package for a released version is reproducible and
#     attached to the run that produced it,
#   - manual dispatch from any branch (the version check is skipped then).
#
# The download link in the run has no signature requirement, so the artifact is
# not published as a GitHub release asset: an unsigned MSIX cannot be installed
# by the public, and the Store listing is the public channel.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop

      - name: Install UI dependencies
        run: npm ci --prefix desktop/ui

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const fs=require('fs');const tag=process.env.GITHUB_REF_NAME.replace(/^v/,'');const version=JSON.parse(fs.readFileSync('desktop/apps/desktop/tauri.conf.json','utf8')).version;if(version!==tag){console.error('tag '+tag+' does not match tauri.conf.json version '+version);process.exit(1);}console.log('store version '+version);"

      - name: Check Rust formatting
        working-directory: desktop
        run: cargo fmt --all -- --check

      # The Store flavour is a different feature set, so it gets its own lint and
      # test run: a `#[cfg(feature = "store")]` path that never compiles in the
      # normal build would otherwise reach Partner Center unnoticed.
      - name: Lint the Store flavour
        working-directory: desktop
        run: cargo clippy -p gentree-desktop --all-targets --features store -- -D warnings

      - name: Test the Store flavour
        working-directory: desktop
        run: cargo test -p gentree-desktop --features store

      - name: Build the Store executable
        working-directory: desktop/apps/desktop
        shell: pwsh
        run: |
          & ..\..\ui\node_modules\.bin\tauri.cmd build --no-bundle --features store --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed with exit code $LASTEXITCODE" }

      - name: Package the MSIX
        shell: pwsh
        run: |
          $version = (Get-Content 'desktop/apps/desktop/tauri.conf.json' -Raw | ConvertFrom-Json).version
          node scripts/package-msix.mjs `
            --exe 'desktop/target/x86_64-pc-windows-msvc/release/gentree-desktop.exe' `
            --version $version `
            --out 'release-assets/store'
          if ($LASTEXITCODE -ne 0) { throw "package-msix.mjs failed with exit code $LASTEXITCODE" }

      # The packager already fails on an invalid manifest; this step re-reads what
      # is inside the file, because a wrong identity or a stray signature is a
      # rejected submission, not a build error.
      - name: Verify the package before upload
        shell: pwsh
        run: |
          $version = (Get-Content 'desktop/apps/desktop/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $expected = "marakogr.Gentree_$version.0_x64.msix"
          $msix = Get-ChildItem 'release-assets/store' -Filter '*.msix' | Select-Object -First 1
          if (-not $msix) { throw 'no .msix was produced' }
          if ($msix.Name -ne $expected) { throw "expected $expected, got $($msix.Name)" }

          $signature = Get-AuthenticodeSignature $msix.FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "the package must stay unsigned for Partner Center, got $($signature.Status)"
          }

          $makeappx = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx) { throw 'makeappx.exe was not found' }
          $layout = Join-Path $env:RUNNER_TEMP 'msix-verify'
          & $makeappx unpack /p $msix.FullName /d $layout /o | Out-Null
          $manifest = Get-Content (Join-Path $layout 'AppxManifest.xml') -Raw
          foreach ($required in @(
            'Name="marakogr.Gentree"',
            'Publisher="CN=CCBFC6D1-565E-4E3F-8A41-E60352A1730E"',
            "Version=`"$version.0`"",
            'Name="runFullTrust"'
          )) {
            if (-not $manifest.Contains($required)) { throw "AppxManifest.xml is missing $required" }
          }

          $sums = 'release-assets/store/SHA256SUMS-store-x64.txt'
          if (-not (Test-Path $sums)) { throw 'the packager did not write the checksum file' }
          Get-Content $sums

      - name: Upload the MSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gentree-store-x64
          path: release-assets/store/*
          if-no-files-found: error
          retention-days: 90
